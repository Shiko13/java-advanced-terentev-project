eureka-server:
  replicaCount: 1
  image:
    repository: salterentev/eureka-server
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8761

main-service:
  replicaCount: 1
  image:
    repository: salterentev/main-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
  env:
    EUREKA_SERVER_URL: http://eureka-server:8761/eureka

trainer-workload-service:
  replicaCount: 1
  image:
    repository: salterentev/trainer-workload-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8081
  env:
    EUREKA_SERVER_URL: http://eureka-server:8761/eureka